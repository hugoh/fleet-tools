name: release

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: bump
        uses: hugoh/cog-bump@934fdc8c1346ff5b3efe52ed63e14c1a4b3825e3 # v0.3.4
        with:
          config: cog.toml

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.bump.outputs.tags != ''
        with:
          enable-cache: false

      # GitHub's --generate-notes lists every PR since the last release of any
      # package; git-cliff keeps only commits that touched this package.
      - name: Create GitHub releases
        if: steps.bump.outputs.tags != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.bump.outputs.tags }}
          # renovate: datasource=pypi depName=git-cliff
          GIT_CLIFF_VERSION: 2.14.2
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            pkg="${tag%-v*}"
            from=$(git describe --tags --abbrev=0 --match "${pkg}-v*" "${tag}^" 2>/dev/null \
              || git rev-list --max-parents=0 "$tag" | tail -n 1)
            uvx "git-cliff@${GIT_CLIFF_VERSION}" --include-path "${pkg}/**" --tag-pattern "^${pkg}-v" \
              --strip all --tag "$tag" "${from}..${tag}" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          done <<< "$TAGS"

      - id: releases
        env:
          TAGS: ${{ steps.bump.outputs.tags }}
        run: |
          set -euo pipefail
          releases=$(jq -Rnc '[inputs | select(length > 0) | {tag: ., pkg: (split("-v") | .[:-1] | join("-v"))}]' <<< "$TAGS")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  # Trusted publishing doesn't work from a reusable workflow
  # (pypi/warehouse#11096), so publishing stays in this top-level workflow.
  # Recover a failed publish with "Re-run failed jobs" on the run.
  publish:
    needs: release
    if: needs.release.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.releases) }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: pypi-${{ matrix.pkg }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build package
        env:
          PKG: ${{ matrix.pkg }}
        run: uv build "$PKG" --out-dir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
