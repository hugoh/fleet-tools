[project]
name = "asyncgh"
description = "Minimal async GitHub REST + GraphQL transport: auth, retry, pagination -- no generated models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hugo Haas" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]

dependencies = ["httpx2>=2.10", "pynacl>=1.5", "stamina>=25.2"]

[project.urls]
Homepage = "https://github.com/hugoh/fleet-tools/tree/main/asyncgh"
Issues = "https://github.com/hugoh/fleet-tools/issues"
Repository = "https://github.com/hugoh/fleet-tools"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7",
  "pytest-httpx2>=0.1",
  "respx>=0.21",
]

[build-system]
requires = ["hatch-vcs>=0.5", "hatchling", "setuptools-scm<11"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["src/asyncgh"]
omit = ["*/_version.py"]

[tool.coverage.report]
fail_under = 88
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^asyncgh-v(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "asyncgh-v*"]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/asyncgh/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asyncgh"]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2", "--cov", "--cov-report=term-missing"]
testpaths = ["tests"]
asyncio_mode = "auto"
