[project]
name = "repo-admin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "asyncgh",
  "httpx2>=2.10",
  "hugoh-repokit",
  "jinja2>=3.1",
  "pynacl>=1.5",
  "pyyaml>=6",
  "reconcilekit",
  "rich>=13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7",
  "pytest-httpx2>=0.1",
  "respx>=0.21",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "templates/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2", "--cov", "--cov-report=term-missing"]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
asyncgh = { workspace = true }
hugoh-repokit = { workspace = true }
reconcilekit = { workspace = true }
