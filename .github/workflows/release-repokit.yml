name: release-repokit

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - repokit-v*
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag) to build and publish
        required: true
        type: string

concurrency:
  group: release-repokit
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: pypi-repokit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build package
        run: uv build --package hugoh-repokit

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
