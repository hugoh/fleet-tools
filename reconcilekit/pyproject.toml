[project]
name = "reconcilekit"
description = "A tiny stateless fetch-diff-apply reconciliation kernel for fleet-wide config tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hugo Haas" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]

dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/hugoh/fleet-tools/tree/main/reconcilekit"
Issues = "https://github.com/hugoh/fleet-tools/issues"
Repository = "https://github.com/hugoh/fleet-tools"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=7"]

[build-system]
# setuptools-scm pinned <9: see the note in asyncgh/pyproject.toml (hatch-vcs 0.4.x
# is not yet compatible with setuptools-scm 10's config surface).
requires = ["hatch-vcs>=0.4", "hatchling", "setuptools-scm>=8,<9"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["src/reconcilekit"]
omit = ["*/_version.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^reconcilekit-v(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "reconcilekit-v*"]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/reconcilekit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcilekit"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing"]
testpaths = ["tests"]
asyncio_mode = "auto"
